ancements belong to the class’s cards, not to you."}],answer:0,explain:"Enhancements are permanent stickers on that class’s cards, unless you play with the temporary-enhancement variant.",ref:L.enhance},{kind:"info",title:"Stickers that stay",visual:a.jsx(Pn,{tone:"--xp",children:"+1 Attack · +1 Move · Poison · Jump …"}),body:"Once the “Power of Enhancement” global achievement is unlocked, buy stickers for the small enhancement marks on ability cards. Prices are in the rulebook appendix. In 2nd edition there’s no limit per card: each mark takes one sticker.",ref:L.enhance},{kind:"mistake",title:"Enhancing from day one",wrong:"You spend your first gold on enhancements in the first City Phase.",right:"Enhancements unlock only after the “Power of Enhancement” global achievement. Until then, gold goes to items and the temple.",ref:L.enhance},{kind:"question",id:"c-enhance.temp",q:"Your group uses the temporary-enhancement variant. What changes?",options:["Enhancements are cheaper but removed when the character retires",{t:"Enhancements last only one scenario",why:"They last until the character retires, not one scenario."},{t:"You can enhance before the global achievement",why:"The variant changes cost and permanence, not when enhancing unlocks."}],answer:0,explain:"Temporary enhancements cost less and come off when that character retires, so the next player of the class starts clean.",ref:L.variants},{kind:"recap",points:["Enhancing unlocks with the “Power of Enhancement” achievement.","Stickers are permanent for that class’s cards (unless you use the temporary variant)."]}]},PI=e=>{const t=ze(e,2,3),n=ze(e,1,4),s=ze(e,1,2),i=n*(4-t);return{type:"number",id:"c-city.gen-inspiration",q:`A party of ${t} characters wins ${n} scenario${n>1?"s":""} and loses ${s}. How much inspiration have they earned?`,min:0,max:8,answer:i,explain:`Each completed scenario gives 4 − ${t} = ${4-t}. Losses give none: ${n} × ${4-t} = ${i}.`,ref:L.endScenario}},AI={id:"c-city",title:"Prosperity &
