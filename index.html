nder")}}),ref:22},{kind:"question",id:"sc-move.jump-multi",type:"multi",q:"Same board, but now Move 3 with Jump. Where can you end?",visual:a.jsx(Mr,{hexes:x0,units:w0,labels:b0,size:30,ariaLabel:"Movement board with hexes A, B and C"}),options:["Hex A","Hex B (difficult)","Hex C (behind the enemies)","The enemy’s hex"],answers:[0,1,2],explain:"Jump passes over the enemy (C costs 2) and ignores difficult terrain completely (B costs 2). A still costs 3. You can never end in an occupied hex.",ref:22},{kind:"question",id:"sc-move.fly-trap",q:"You end a move on a trap hex. Which way of moving keeps you safe?",options:["Flying",{t:"Jump",why:"Jump only ignores traps you pass over. The hex you land in still triggers."},{t:"Neither",why:"Flying ignores every overlay, including the hex you end in."}],answer:0,reason:{q:"Why?",options:["Flying ignores terrain even in the final hex",{t:"Traps only trigger on a normal Move",why:"Pushes, pulls and teleports onto a trap trigger it too."},{t:"Jump makes you immune to traps",why:"Jump still triggers the landing hex."}],answer:0},explain:"Jump ignores everything along the way but still triggers the landing hex. Flying ignores terrain even where you end.",ref:22},{kind:"mistake",title:"Splitting a move",wrong:"Move 3: step 1 hex, attack, then step the last 2 hexes.",right:"Each ability finishes before the next starts. Make all of the Move, then the Attack. Points you don’t use are lost.",ref:18},{kind:"question",id:"sc-move.teleport",q:"Teleport 3. The only empty hex in range is on the far side of a wall, and it holds a trap. What happens?",options:["You can teleport there, and the trap springs",{t:"You can’t: walls block teleport",why:"Teleport ignores everything between you and the destination, walls included."},{t:"You teleport there safely",why:"Teleport ignores the way there, not the destination. The trap still springs."}],answer:0,explain:"Teleport isn’t movement: nothing in between matters, but the hex you arrive in triggers er your ally and an obstacle, which don’t block sight. W is behind a wall. F is visible but 5 hexes away.",ref:19},{kind:"info",title:"Line of sight",visual:a.jsx(Pn,{tone:"--el-light",children:"Only walls and closed doors block sight."}),body:"Draw a line from any part of your hex to any part of the target’s hex. If it touches no wall, you can see it. Figures and obstacles never block.",ref:19},{kind:"task",title:"Call it",task:"Decide, for each target, whether you can see it.",render:({done:e,award:t})=>a.jsx(TM,{onDone:e,onPerfect:()=>t("eagle-eye")}),ref:19},{kind:"info",title:"Range",visual:a.jsx(dt,{items:[{icon:"range",t:"Range X",d:"Up to X hexes, counted around walls, not through them."},{icon:"attack",t:"No range = melee",d:"Adjacent targets only."},{icon:"muddle",t:"Ranged vs adjacent",d:"Disadvantage, automatically.",hue:"--blood"},{icon:"hex",t:"Not targeted?",d:"Then no sight is needed."}]}),body:"Attacks, heals, conditions and forced movement are all targeted: they need sight and a valid target.",ref:19},{kind:"question",id:"sc-los.adjacent-ranged",q:"You attack an adjacent enemy with Attack 3, Range 3. What changes?",options:["You attack with disadvantage",{t:"Nothing, adjacent is in range",why:"It is in range, but a ranged attack against an adjacent target gets disadvantage."},{t:"You can’t: ranged attacks need distance",why:"You can, but with disadvantage. Step away first if you can."}],answer:0,explain:"Ranged attacks on adjacent targets draw two modifiers and use the worse. Move away first when you can.",ref:25},{kind:"question",id:"sc-los.cancel",q:"You are strengthened. You make a ranged attack against an adjacent enemy. How many modifier cards do you draw?",options:[{t:"2, you choose",why:"Strengthen gives advantage, but the adjacent ranged attack gives disadvantage. They cancel."},"1",{t:"2, use the worse",why:"Disadvantage is cancelled by the advantage from strengthen."}],answer:1,explain:"Advantage and disadvantage never stack. Having both advantage",d:"Draw 2, use the worse. If unclear, the first drawn.",hue:"--blood"}]}),body:"They never stack. Having both means having neither: draw one card.",ref:25},{kind:"task",title:"Draw!",task:"Draw 3 modifiers. Try advantage or disadvantage.",render:({done:e})=>a.jsx(n4,{onDraw:t=>t>=3&&e()}),ref:24},{kind:"gen",gen:x4},{kind:"question",id:"sc-mods.shuffle",q:"You draw 2x on your first attack this round. When is your deck reshuffled?",options:["At the end of this round",{t:"Right away",why:"Only if the deck runs out mid-draw. Otherwise you wait for the end of the round."},{t:"When the deck runs out",why:"The shuffle icon means: shuffle at the end of the round it was drawn."}],answer:0,explain:"2x and null carry a shuffle icon: at the end of that round, shuffle the discards back in.",ref:24},{kind:"question",id:"sc-mods.bless",q:"You draw a bless card. Where does it go afterwards?",options:["Back to the supply",{t:"Your modifier discard pile",why:"Bless and curse never go to your discard. Each is used once."},{t:"Back into your deck",why:"It’s used once, then returned to the supply."}],answer:0,explain:"Bless (acts as 2x) and curse (acts as null) are removed when drawn. Any left at the end of the scenario are removed too.",ref:24},{kind:"mistake",title:"Advantage in 2nd edition",wrong:"“Advantage: I must use the higher card.”",right:"In 2nd edition a character may choose either card, which matters when one has an effect you don’t want. Monsters always take the better.",ref:25},{kind:"recap",points:["Null = 0 damage, effects still apply. 2x doubles.","2x or null drawn: shuffle that deck at end of round.","Advantage: characters pick either, monsters the better. Disadvantage: the worse.","Both at once: draw one. Bless and curse return to the supply."]}]},P4={id:"sc-conditions",title:"Conditions",icon:"poison",blurb:"Twelve status effects and their clocks.",goal:"Know what each condition does and exactly when it ends.",steps:[{kind:"question",id:"sc-conditions.pre-heal",pretest:!0,q:"You are poisoned and wounded, missing 3 HP. You Heal 2. Result?",options:["Poison and wound removed, no HP gained",{t:"+2 HP, poison and wound removed",why:"A heal on a poisoned figure removes the poison instead of restoring HP."},{t:"Wound removed, +2 HP, still poisoned",why:"One heal removes both poison and wound."}],answer:0,explain:"One heal clears both poison and wound. Because you were poisoned, it restores no HP.",ref:27},{kind:"task",title:"Positive conditions",task:"Reveal all five.",render:({done:e})=>a.jsx(hf,{onAllSeen:e,items:[{icon:"strengthen",title:"Strengthen",body:"Advantage on all your attacks.",foot:"Ends: end of your next turn"},{icon:"invisible",title:"Invisible",body:"Enemies can’t focus on or target you, and may move through you. Non-targeted effects still hit.",foot:"Ends: end of your next turn"},{icon:"bless",title:"Bless",body:"Shuffle a bless card (acts as 2x) into your modifier deck.",foot:"Ends: when drawn"},{icon:"ward",title:"Ward",body:"The next damage you suffer from any source is halved, rounded down.",foot:"Ends: after that damage"},{icon:"safeguard",title:"Safeguard",body:"Blocks the next negative condition you would gain.",foot:"Ends: when it blocks one"}]}),ref:26},{kind:"task",title:"Negative conditions",task:"Reveal all seven.",render:({done:e})=>a.jsx(hf,{onAllSeen:e,items:[{icon:"poison",title:"Poison",body:"Attacks against you get +1. A heal removes poison but restores no HP.",foot:"Ends: when healed"},{icon:"wound",title:"Wound",body:"Suffer 1 damage at the start of each of your turns.",foot:"Ends: when healed"},{icon:"immobilize",title:"Immobilize",body:"You cannot perform move abilities.",foot:"Ends: end of your next turn"},{icon:"disarm",title:"Disarm",body:"You cannot perform attack abilities.",foot:"Ends: end of your next turn"},{icon:"stun",title:"Stun",body:"No abilities, no items. You still choose cards, and can still long rest.",foot:"Ends: end of your next turn"},{icon:"muddle",title:"Muddle",body:"Disadvantage on all your attacks.",foot:"Ends: end of your next turn"},{icon:"curse",title:"Curse",body:"Shuffle a curse card (acts as null) into your modifier deck.",foot:"Ends: when drawn"}]}),ref:27},{kind:"mistake",title:"Poison is not damage over time",wrong:"“I’m poisoned, so I lose 1 HP every turn.”",right:"That’s wound. Poison makes every attack against you +1, and turns your next heal into a cure with no HP.",ref:27},{kind:"walk",title:"When does it end?",intro:"“Until the end of its next turn” depends on whether the figure has already acted this round.",ref:26,frames:[{visual:a.jsx(gf,{figs:[{name:"You",init:15,kind:"hero",hue:"--el-ice",note:"Attack 2, Muddle"},{name:"Archer A",init:60,kind:"monster",note:"acts later this round"}]}),text:"Round 3. At initiative 15 you muddle Archer A, which acts at 60 this round."},{predict:{q:"Which Archer turns are muddled?",options:["Only its turn this round","This round’s and next round’s"],answer:0},text:"Its next turn is this round, at 60. Muddle ends at the end of that turn."},{predict:{q:"Your own card strengthens you during your turn. When does it end?",options:["At the end of this turn","At the end of your next turn"],answer:1},text:"A condition you gain during your own turn works right away and lasts through your next turn."}]},{kind:"question",id:"sc-conditions.stun",q:"You start the round stunned. What can you do?",options:["Choose 2 cards as usual, or declare a long rest",{t:"Nothing: skip card selection",why:"You still choose cards; they’re discarded unused if you’re still stunned at the end of your turn."},{t:"Only use items",why:"Stun blocks items too."}],answer:0,explain:"A stunned character still picks 2 cards (or long rests). Long rest works normally, so stun is a good moment to rest.",ref:27},{kind:"question",id:"sc-conditions.ends-multi",type:"multi",q:"Which of these end at the end of the figure’s next turn?",options:["Muddle","Wound","Immobilize","Ward","Curse"],answers:[0,2],explain:"Muddl
